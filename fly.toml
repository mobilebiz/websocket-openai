# fly.toml app configuration file generated for websocket-openai on 2025-11-18T00:49:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'websocket-openai'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # 'stop' だとアイドル後の起動に約 8 秒かかり、Vonage の answer_url
  # タイムアウト (5 秒・上限も 5 秒) に間に合わず着信が切断される。
  # 'suspend' はメモリを保持したまま止めるので復帰が速い。
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
